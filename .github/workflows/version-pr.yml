name: OpenXiangda version pull request

# Phase 1 可选自动化（方案 2026-09-13-release-pipeline-optimization-and-ci-proposal.md）：
# 有待消费 changeset 时自动开/更新版本物化 PR（运行 pnpm release:version）。
# 试运行期仅手动触发；验证可靠后再改为 push(master) 自动触发。
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-pr
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.1
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 24
          cache: pnpm
      - uses: changesets/action@0138f456ec3d73906fcd11169ce59502d8d241c1
        with:
          version: pnpm release:version
          title: 'chore: release version materialization'
          commit: 'chore: materialize release versions'
        env:
          GITHUB_TOKEN: ${{ github.token }}
