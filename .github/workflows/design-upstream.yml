name: OpenDesign capability updates
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opendesign-upstream
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 24
      - run: node scripts/design-capabilities.mjs --check
      - run: node scripts/check-opendesign-upstream.mjs --output design-update.json
      - name: Preserve reviewable comparison
        run: |
          echo 'OpenDesign candidate comparison (installed resources unchanged)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat design-update.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
