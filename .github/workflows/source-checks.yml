name: OpenXiangda source checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 发布材料的早失败层：发布脚本测试与文档（VitePress）构建
      # 在 push 后几分钟内暴露发布说明/脚本类错误，而不是发布运行 20 分钟后。
      - run: node --test scripts/test/*.test.mjs
      - if: github.event_name != 'pull_request'
        run: pnpm docs:build
      # 文档主题改动必须同时提交重新生成的打包引用副本，否则发布技能门禁
      # 会在发布中段以 GUIDANCE_DRIFT 失败（2026-09-14 实测）；提前到 push 拦截。
      - if: github.event_name != 'pull_request'
        name: Check packaged guidance references are synced
        run: |
          node scripts/sync-developer-guidance.mjs
          git diff --exit-code -- skills/ documentation/
      - name: Select source comparison
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE" && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=$GITHUB_SHA" >> "$GITHUB_ENV"
            pnpm exec turbo run check test build --filter='!openxiangda-application'
          fi
          echo "TURBO_SCM_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
      - run: pnpm verify:affected
      - name: Select visual integration checks
        id: design
        run: |
          if ! git diff --quiet "$TURBO_SCM_BASE" "$GITHUB_SHA" -- .github/workflows/source-checks.yml docs/design-workflow.md scripts/verify-design-workbench.mjs scripts/fixtures/design-workbench packages/openxiangda/scripts/scope-mobile-css.mjs packages/openxiangda/src/field-kit.ts packages/openxiangda/src/browser/ui-provider.tsx packages/openxiangda/src/browser/components/resource/ResourceFormFrame.tsx packages/openxiangda/src/browser/styles.css packages/openxiangda/src/browser/mobile-fields.css; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.design.outputs.affected == 'true'
        run: pnpm --dir templates/application/apps/web exec playwright install --with-deps chromium
      - if: steps.design.outputs.affected == 'true'
        run: pnpm exec turbo run build --filter=openxiangda...
      - if: steps.design.outputs.affected == 'true'
        run: pnpm design:check
