name: OpenXiangda source checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.1
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select source comparison
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE" && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=$GITHUB_SHA" >> "$GITHUB_ENV"
            pnpm exec turbo run check test build --filter='!openxiangda-application'
          fi
          echo "TURBO_SCM_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
      - run: pnpm verify:affected
      - run: node --test scripts/test/*.test.mjs
      - name: Select design integration checks
        id: design
        run: |
          if ! git diff --quiet "$TURBO_SCM_BASE" "$GITHUB_SHA" -- .github/workflows/source-checks.yml design-capabilities docs/design-workflow.md scripts/design-capabilities.mjs scripts/verify-design-workbench.mjs scripts/fixtures/design-workbench packages/openxiangda/scripts/scope-mobile-css.mjs packages/openxiangda/src/field-kit.ts packages/openxiangda/src/browser/ui-provider.tsx packages/openxiangda/src/browser/components/resource/ResourceFormFrame.tsx packages/openxiangda/src/browser/styles.css packages/openxiangda/src/browser/mobile-fields.css; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.design.outputs.affected == 'true'
        run: pnpm --dir templates/application/apps/web exec playwright install --with-deps chromium
      - if: steps.design.outputs.affected == 'true'
        run: pnpm exec turbo run build --filter=openxiangda...
      - if: steps.design.outputs.affected == 'true'
        run: pnpm design:check
