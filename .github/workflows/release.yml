name: OpenXiangda release

# Phase 2/3（方案 2026-09-13-release-pipeline-optimization-and-ci-proposal.md）：
# 受 environment:npm 人工批准保护的发布 workflow。发布字节 = 验证字节：
# 同一 job 内先完整 verify:release，再以 npm OIDC Trusted Publishing 发布，
# 随后同步 git tag 与 GitHub Release 并归档回执。
# 在 npm 侧为 7 个包配置 trusted publisher（仓库 1377385356/openxiangda +
# workflow .github/workflows/release.yml + environment npm）之前，
# npm 会拒绝本 workflow 的发布请求（fail-closed，不会误发）。
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      GH_TOKEN: ${{ github.token }}
      # Phase 3 生效：本地默认通道关闭后，同一断言保护 CI 内的单一发布者。
      OPENXIANGDA_RELEASE_REQUIRE_CI: '1'
    steps:
      - name: Configure reference application root
        run: echo "OPENXIANGDA_REFERENCE_APP_ROOT=$RUNNER_TEMP/openxiangda-v2-reference-app" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # release-publish 会 git push 发布 tag，需要持久凭据。
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Require reference repository credentials
        env:
          HAS_REFERENCE_TOKEN: ${{ secrets.REFERENCE_REPO_TOKEN != '' }}
        if: env.HAS_REFERENCE_TOKEN != 'true'
        run: |
          echo "::error::发布需要参考应用仓库（1377385356/openxiangda-v2-reference-app，私有）的写凭据：secret REFERENCE_REPO_TOKEN（仅授予该参考仓 contents 读写的 fine-grained PAT）。"
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Clone reference application
        env:
          REFERENCE_REPO_TOKEN: ${{ secrets.REFERENCE_REPO_TOKEN }}
        run: |
          CREDENTIALS="$(printf 'x-access-token:%s' "$REFERENCE_REPO_TOKEN" | base64 -w0)"
          git clone \
            -c http.https://github.com/.extraheader="Authorization: Basic $CREDENTIALS" \
            --branch master \
            https://github.com/1377385356/openxiangda-v2-reference-app.git \
            "$OPENXIANGDA_REFERENCE_APP_ROOT"
          git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" config user.name 'openxiangda-release-bot'
          git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" config user.email 'release-bot@users.noreply.github.com'
      - name: Materialize and push reference alignment
        run: |
          pnpm reference:install:from-build
          git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" add -A
          if ! git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" diff --cached --quiet; then
            git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" commit -m 'chore: align to release candidate build'
            git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" push origin master
          fi
      - name: Verify and publish
        run: pnpm release:publish
      - name: Archive release receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-receipt-${{ github.run_id }}
          path: .git/openxiangda-release-history
          if-no-files-found: ignore
          retention-days: 90
      - name: Check reference lock matches published registry
        run: pnpm release:sync-reference
