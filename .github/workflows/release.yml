name: OpenXiangda release

# 作业化发布（方案 2026-09-13-release-pipeline-optimization-and-ci-proposal.md
# 第八节 D1+D2）：
#   freeze → core ∥ packed ∥ reference → publish（environment: npm 人工批准）
# 冻结 job 打包候选一次，回执与制品经 artifact 交接给各验证 job 与发布
# job——发布字节=验证字节由"同一份制品"构造保证；每个 job 独立超时与
# 进程树，任一 job 死亡不再产生跨机器孤儿或静默挂起。
# 在 npm 侧为 7 个包配置 trusted publisher（仓库 1377385356/openxiangda +
# workflow .github/workflows/release.yml + environment npm）之前，
# npm 会拒绝本 workflow 的发布请求（fail-closed，不会误发）。
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      GH_TOKEN: ${{ github.token }}
    outputs:
      release-head: ${{ steps.head.outputs.sha }}
    steps:
      - name: Configure reference application root
        run: echo "OPENXIANGDA_REFERENCE_APP_ROOT=$RUNNER_TEMP/openxiangda-v2-reference-app" >> "$GITHUB_ENV"
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
          cache: pnpm
      - name: Require reference repository credentials
        env:
          HAS_REFERENCE_TOKEN: ${{ secrets.REFERENCE_REPO_TOKEN != '' }}
        if: env.HAS_REFERENCE_TOKEN != 'true'
        run: |
          echo "::error::发布需要参考应用仓库（1377385356/openxiangda-v2-reference-app，私有）的写凭据：secret REFERENCE_REPO_TOKEN（仅授予该参考仓 contents 读写的 fine-grained PAT）。"
          exit 1
      - name: Record release head
        id: head
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clone reference application
        env:
          REFERENCE_REPO_TOKEN: ${{ secrets.REFERENCE_REPO_TOKEN }}
        run: |
          CREDENTIALS="$(printf 'x-access-token:%s' "$REFERENCE_REPO_TOKEN" | base64 -w0)"
          git clone \
            -c http.https://github.com/.extraheader="Authorization: Basic $CREDENTIALS" \
            --branch master \
            https://github.com/1377385356/openxiangda-v2-reference-app.git \
            "$OPENXIANGDA_REFERENCE_APP_ROOT"
          git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" config user.name 'openxiangda-release-bot'
          git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" config user.email 'release-bot@users.noreply.github.com'
      - name: Build workspace
        run: pnpm build
      - name: Materialize and push reference alignment
        run: |
          pnpm reference:install:from-build
          git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" add -A
          if ! git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" diff --cached --quiet; then
            git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" commit -m 'chore: align to release candidate build'
            git -C "$OPENXIANGDA_REFERENCE_APP_ROOT" push origin master
          fi
      - name: Freeze candidates and receipt
        run: pnpm release:publish --freeze-only
      - name: Stage release state for artifact handoff
        run: |
          GITDIR="$(git rev-parse --git-common-dir)"
          mkdir -p "$RUNNER_TEMP/release-state"
          cp "$GITDIR/openxiangda-release-receipt.json" "$RUNNER_TEMP/release-state/"
          cp -R "$GITDIR/openxiangda-release-artifacts-$GITHUB_SHA" "$RUNNER_TEMP/release-state/"
      - name: Upload frozen release state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-state-${{ github.run_id }}
          path: ${{ runner.temp }}/release-state
          retention-days: 7
          if-no-files-found: error

  verify-core:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      GH_TOKEN: ${{ github.token }}
      OPENXIANGDA_RELEASE_STAGES: core
      OPENXIANGDA_RELEASE_VERIFY_TIMEOUT_SECONDS: '1500'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
          cache: pnpm
      - name: Restore frozen release state
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-state-${{ github.run_id }}
          path: ${{ runner.temp }}/release-state
      - name: Place frozen receipt and artifacts
        run: |
          GITDIR="$(git rev-parse --git-common-dir)"
          cp "$RUNNER_TEMP/release-state/openxiangda-release-receipt.json" "$GITDIR/"
          cp -R "$RUNNER_TEMP/release-state/openxiangda-release-artifacts-${{ needs.freeze.outputs.release-head }}" "$GITDIR/"
          echo "OPENXIANGDA_RELEASE_ARTIFACT_MANIFEST=$GITDIR/openxiangda-release-artifacts-${{ needs.freeze.outputs.release-head }}/manifest.json" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run core verification
        run: node scripts/release-validate.mjs

  verify-packed:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      GH_TOKEN: ${{ github.token }}
      OPENXIANGDA_RELEASE_STAGES: packed
      OPENXIANGDA_RELEASE_VERIFY_TIMEOUT_SECONDS: '1800'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Restore frozen release state
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-state-${{ github.run_id }}
          path: ${{ runner.temp }}/release-state
      - name: Place frozen receipt and artifacts
        run: |
          GITDIR="$(git rev-parse --git-common-dir)"
          cp "$RUNNER_TEMP/release-state/openxiangda-release-receipt.json" "$GITDIR/"
          cp -R "$RUNNER_TEMP/release-state/openxiangda-release-artifacts-${{ needs.freeze.outputs.release-head }}" "$GITDIR/"
          echo "OPENXIANGDA_RELEASE_ARTIFACT_MANIFEST=$GITDIR/openxiangda-release-artifacts-${{ needs.freeze.outputs.release-head }}/manifest.json" >> "$GITHUB_ENV"
      - name: Start failure heartbeat monitor
        run: |
          mkdir -p /tmp/heartbeat
          nohup bash -c 'while true; do { echo "=== $(date -u +%FT%TZ)"; free -m | sed -n 2p; df -h / | sed -n 2p; ps aux --sort=-rss | sed -n "2,7p"; } >> /tmp/heartbeat/heartbeat.log 2>&1; sleep 30; done' >/dev/null 2>&1 &
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run packed-distribution verification
        run: node scripts/release-validate.mjs
      - name: Archive heartbeat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heartbeat-packed-${{ github.run_id }}
          path: /tmp/heartbeat
          if-no-files-found: ignore
          retention-days: 14

  verify-reference:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      GH_TOKEN: ${{ github.token }}
      OPENXIANGDA_RELEASE_STAGES: reference
      OPENXIANGDA_RELEASE_VERIFY_TIMEOUT_SECONDS: '1200'
    steps:
      - name: Configure reference application root
        run: echo "OPENXIANGDA_REFERENCE_APP_ROOT=$RUNNER_TEMP/openxiangda-v2-reference-app" >> "$GITHUB_ENV"
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
          cache: pnpm
      - name: Restore frozen release state
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-state-${{ github.run_id }}
          path: ${{ runner.temp }}/release-state
      - name: Place frozen receipt and artifacts
        run: |
          GITDIR="$(git rev-parse --git-common-dir)"
          cp "$RUNNER_TEMP/release-state/openxiangda-release-receipt.json" "$GITDIR/"
          cp -R "$RUNNER_TEMP/release-state/openxiangda-release-artifacts-${{ needs.freeze.outputs.release-head }}" "$GITDIR/"
          echo "OPENXIANGDA_RELEASE_ARTIFACT_MANIFEST=$GITDIR/openxiangda-release-artifacts-${{ needs.freeze.outputs.release-head }}/manifest.json" >> "$GITHUB_ENV"
      - uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Clone reference application
        env:
          REFERENCE_REPO_TOKEN: ${{ secrets.REFERENCE_REPO_TOKEN }}
        run: |
          CREDENTIALS="$(printf 'x-access-token:%s' "$REFERENCE_REPO_TOKEN" | base64 -w0)"
          git clone \
            -c http.https://github.com/.extraheader="Authorization: Basic $CREDENTIALS" \
            --branch master \
            https://github.com/1377385356/openxiangda-v2-reference-app.git \
            "$OPENXIANGDA_REFERENCE_APP_ROOT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install e2e browser
        # 参考应用与工具链模板钉同一 playwright 版本；浏览器二进制按版本
        # 共享于 ~/.cache/ms-playwright，参考 e2e 直接复用。
        run: pnpm --filter @app/web exec playwright install chromium
      - name: Run reference verification
        run: node scripts/release-validate.mjs

  publish:
    # freeze 必须在 needs 里：outputs 只对直接依赖作业可见。
    needs: [freeze, verify-core, verify-packed, verify-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      GH_TOKEN: ${{ github.token }}
      OPENXIANGDA_RELEASE_REQUIRE_CI: '1'
    steps:
      - name: Configure reference application root
        run: echo "OPENXIANGDA_REFERENCE_APP_ROOT=$RUNNER_TEMP/openxiangda-v2-reference-app" >> "$GITHUB_ENV"
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          # release-publish 会 git push 发布 tag，需要持久凭据。
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.15.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
          cache: pnpm
      - name: Restore frozen release state
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: release-state-${{ github.run_id }}
          path: ${{ runner.temp }}/release-state
      - name: Place frozen receipt and artifacts
        run: |
          GITDIR="$(git rev-parse --git-common-dir)"
          cp "$RUNNER_TEMP/release-state/openxiangda-release-receipt.json" "$GITDIR/"
          cp -R "$RUNNER_TEMP/release-state/openxiangda-release-artifacts-${{ needs.freeze.outputs.release-head }}" "$GITDIR/"
      - name: Start failure heartbeat monitor
        run: |
          mkdir -p /tmp/heartbeat
          nohup bash -c 'while true; do { echo "=== $(date -u +%FT%TZ)"; free -m | sed -n 2p; df -h / | sed -n 2p; ps aux --sort=-rss | sed -n "2,7p"; } >> /tmp/heartbeat/heartbeat.log 2>&1; sleep 30; done' >/dev/null 2>&1 &
      - name: Clone reference application
        env:
          REFERENCE_REPO_TOKEN: ${{ secrets.REFERENCE_REPO_TOKEN }}
        run: |
          CREDENTIALS="$(printf 'x-access-token:%s' "$REFERENCE_REPO_TOKEN" | base64 -w0)"
          git clone \
            -c http.https://github.com/.extraheader="Authorization: Basic $CREDENTIALS" \
            --branch master \
            https://github.com/1377385356/openxiangda-v2-reference-app.git \
            "$OPENXIANGDA_REFERENCE_APP_ROOT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # needs 拓扑保证三腿全绿才到达这里；--mark-validated 只做安全断言，
      # 门禁的执行证据就是三个 verify job 的绿色结论。
      - name: Mark receipt validated
        run: pnpm release:publish --mark-validated
      - name: Publish frozen candidates
        run: pnpm release:publish
      - name: Archive release state and heartbeat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-history-${{ github.run_id }}
          path: |
            /tmp/heartbeat
            .git/openxiangda-release-history
            .git/openxiangda-release-receipt.json
            .git/openxiangda-release-artifacts-*
          if-no-files-found: ignore
          retention-days: 90
      - name: Check reference lock matches published registry
        run: pnpm release:sync-reference
