name: Dist-tag authentication check

# 一次性诊断（可随时删除）：验证 release.yml 的 .npmrc 认证步骤能让
# npm 在 runner 上执行 dist-tag 写操作。执行的是幂等设置（设为当前值），
# 不改变任何通道状态。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
      - name: Require dist-tag token
        env:
          HAS_DISTTAG_TOKEN: ${{ secrets.NPM_DISTTAG_TOKEN != '' }}
        if: env.HAS_DISTTAG_TOKEN != 'true'
        run: |
          echo "::error::缺少 secret NPM_DISTTAG_TOKEN。"
          exit 1
      - name: Write npmrc from token (same as release.yml)
        env:
          NPM_DISTTAG_TOKEN: ${{ secrets.NPM_DISTTAG_TOKEN }}
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_DISTTAG_TOKEN" >> ~/.npmrc
      - name: Idempotent dist-tag write
        run: npm dist-tag add openxiangda@2.18.6 stable-v2 --prefer-online
